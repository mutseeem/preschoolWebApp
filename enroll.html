<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج التسجيل - روضة براعم بوصلة العلوم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF8C42; --secondary: #3FC1C9; --accent: #FFD166;
            --dark: #2B2D42; --light: #FDFCFF; --pink: #FF6B6B; --green: #06D6A0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Tajawal', sans-serif; color: var(--dark);
            overflow-x: hidden; line-height: 1.7;
            background: linear-gradient(-45deg, #e0f7fa, #fce4ec, #fff3e0, #d1c4e9);
            background-size: 400% 400%; animation: animateGradient 25s ease infinite;
        }
        @keyframes animateGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        nav {
            background-color: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); padding: 0.5rem 5%; display: flex;
            justify-content: space-between; align-items: center; position: fixed;
            width: 100%; top: 0; z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo-link { display: flex; align-items: center; text-decoration: none; }
        .logo { height: 60px; width: auto; transition: transform 0.3s ease; }
        .logo-link:hover .logo { transform: scale(1.1); }
        .logo-text { font-size: 1.6rem; color: var(--primary); font-weight: 900; margin-right: 1rem; }
        .nav-links { display: flex; gap: 2.5rem; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 700; font-size: 1.1rem; transition: all 0.3s; position: relative; padding: 0.5rem 0; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; right: 50%; transform: translateX(50%); width: 0; height: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.4s; }
        .nav-links a:hover::after { width: 110%; }
        .hamburger { display: none; cursor: pointer; z-index: 1002; background: none; border: none; padding: 10px; }
        .hamburger .bar { display: block; width: 25px; height: 3px; margin: 5px auto; background-color: var(--dark); border-radius: 3px; transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); }
        .hamburger.active .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .hamburger.active .bar:nth-child(2) { opacity: 0; }
        .hamburger.active .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        .page-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; }
        .shape { position: absolute; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); opacity: 0.7; }
        .shape-1 { top: 15%; left: 10%; width: 80px; animation: float-1 15s infinite linear; }
        .shape-2 { top: 70%; left: 20%; width: 100px; animation: float-2 20s infinite linear; }
        .shape-3 { top: 20%; left: 85%; width: 60px; animation: float-3 18s infinite linear; }
        .shape-4 { top: 80%; left: 75%; width: 90px; animation: float-4 25s infinite linear; }
        .shape-5 { top: 50%; left: 50%; width: 50px; animation: float-1 16s infinite reverse linear; }
        @keyframes float-1 { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(15deg); } }
        @keyframes float-2 { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-25px) rotate(-10deg); } }
        @keyframes float-3 { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
        @keyframes float-4 { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-15px, -35px) rotate(-180deg); } }
        .main-container { padding: 120px 1rem 50px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { width: 100%; max-width: 850px; padding: 2.5rem 3rem; background-color: rgba(255, 255, 255, 0.75); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); }
        .form-title { text-align: center; color: var(--primary); font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; gap: 1rem; }
        .form-description { text-align: center; font-size: 1.1rem; margin-bottom: 2.5rem; color: var(--dark); line-height: 1.6; }
        .enroll-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem 2rem; }
        .form-group { position: relative; }
        .form-group label { display: block; margin-bottom: 0.7rem; font-weight: 700; color: var(--dark); font-size: 1rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.9rem 1.1rem; border: 1px solid #ccc; background-color: rgba(255, 255, 255, 0.5); border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 1rem; transition: all 0.3s; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.2); background-color: rgba(255, 255, 255, 0.9); }
        .radio-group { display: flex; gap: 2rem; align-items: center; margin-top: 0.5rem; padding: 0.5rem 0; }
        .radio-option { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; }
        .radio-option input { width: auto; accent-color: var(--primary); }
        .full-width { grid-column: 1 / -1; }
        .health-problem-field { display: none; animation: fadeIn 0.5s; }
        .submit-btn { grid-column: 1 / -1; background: linear-gradient(45deg, var(--pink), var(--primary)); color: white; border: none; padding: 1.1rem; font-size: 1.3rem; border-radius: 50px; cursor: pointer; font-weight: 700; margin-top: 1.5rem; box-shadow: 0 5px 15px rgba(255,107,107,0.4); transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.8rem; }
        .submit-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(255,107,107,0.5); }
        footer { background-color: transparent; color: var(--dark); padding: 3rem 5%; text-align: center; }
        .footer-bottom { padding-top: 2rem; border-top: 1px solid rgba(43, 45, 66, 0.1); font-size: 0.9rem; }
        .footer-bottom a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .modal { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -150%); padding: 1rem 2rem; border-radius: 12px; color: white; font-weight: 700; z-index: 2000; transition: transform 0.5s ease-in-out; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .modal.show { transform: translate(-50%, 0); }
        .modal.success { background-color: var(--green); }
        .modal.error { background-color: var(--pink); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 767px) {
            .main-container { padding: 90px 1rem 2rem; }
            .form-container { padding: 2rem 1.5rem; }
            .form-title { font-size: 2rem; }
            .enroll-form { grid-template-columns: 1fr; gap: 1.2rem; }
            
            /* --- FIX STARTS HERE --- */
            .logo-text { font-size: 1rem; margin-right: 0.5rem; } /* The rule hiding this was removed, and this was added */
            .logo { height: 40px; } /* Adjusted logo size for mobile */
            /* --- FIX ENDS HERE --- */

            .hamburger { display: block; }
            .nav-links {
                position: fixed; top: 0; right: 0; transform: translateX(100%);
                width: 75%; height: 100vh;
                background-color: rgba(253, 252, 255, 0.9);
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
                flex-direction: column; align-items: center; justify-content: center;
                gap: 2.5rem; z-index: 1001;
                transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            }
            .nav-links.active { transform: translateX(0); }
            .nav-links a { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="page-background">
        <img src="https://img.icons8.com/plasticine/100/000000/star.png" class="shape shape-1" alt="star icon">
        <img src="https://img.icons8.com/plasticine/100/pencil.png" class="shape shape-2" alt="pencil icon">
        <img src="https://img.icons8.com/plasticine/100/book.png" class="shape shape-3" alt="book icon">
        <img src="https://img.icons8.com/clouds/100/000000/rocket.png" class="shape shape-4" alt="rocket icon">
        <img src="https://img.icons8.com/plasticine/100/sun.png" class="shape shape-5" alt="sun icon">
    </div>

    <nav>
        <a href="index.html" class="logo-link">
            <img src="src/11.jpg" alt="روضة براعم بوصلة العلوم Logo" class="logo">
            <span class="logo-text">روضة براعم بوصلة العلوم</span>
        </a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="index.html#about">عن الروضة</a></li>
            <li><a href="index.html#programs">البرامج</a></li>
            <li><a href="index.html#gallery">معرض الصور</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
    </nav>
    
    <main class="main-container">
        <div class="form-container">
            <h1 class="form-title">📝 نموذج التسجيل</h1>
            <p class="form-description">نحن متحمسون جداً لاحتمال انضمام برعمكم الصغير إلينا! يرجى تعبئة النموذج أدناه لبدء رحلة التعلم والمرح.</p>
            
            <form class="enroll-form" id="enrollmentForm">
                <div class="form-group"><label for="fatherFirstName">اسم الأب الأول</label><input type="text" id="fatherFirstName" name="fatherFirstName" required></div>
                <div class="form-group"><label for="fatherLastName">اسم العائلة (الأب)</label><input type="text" id="fatherLastName" name="fatherLastName" required></div>
                <div class="form-group"><label for="motherFirstName">اسم الأم الأول</label><input type="text" id="motherFirstName" name="motherFirstName" required></div>
                <div class="form-group"><label for="motherLastName">اسم العائلة (الأم)</label><input type="text" id="motherLastName" name="motherLastName" required></div>
                <div class="form-group"><label for="childName">اسم الطفل/الطفلة الكامل</label><input type="text" id="childName" name="childName" required></div>
                <div class="form-group"><label for="childBirthDate">تاريخ ميلاد الطفل</label><input type="date" id="childBirthDate" name="childBirthDate" required></div>
                <div class="form-group"><label for="parentPhone">رقم هاتف ولي الأمر</label><input type="tel" id="parentPhone" name="parentPhone" required></div>
                <div class="form-group"><label for="parentEmail">البريد الإلكتروني لولي الأمر</label><input type="email" id="parentEmail" name="parentEmail" required></div>
                <div class="form-group full-width">
                    <label>هل يعاني الطفل من أي حساسية أو مشاكل صحية؟</label>
                    <div class="radio-group">
                        <div class="radio-option"><input type="radio" id="healthYes" name="healthProblem" value="yes"><label for="healthYes">نعم</label></div>
                        <div class="radio-option"><input type="radio" id="healthNo" name="healthProblem" value="no" checked><label for="healthNo">لا</label></div>
                    </div>
                </div>
                <div class="form-group health-problem-field full-width" id="healthProblemField">
                    <label for="healthProblemDetails">إذا كانت الإجابة نعم، يرجى التوضيح</label>
                    <textarea id="healthProblemDetails" name="healthProblemDetails" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submitButton"><span>🚀</span> إرسال طلب التسجيل</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-bottom"><p>&copy; 2025 روضة براعم بوصلة العلوم. كل الحقوق محفوظة.</p></div>
    </footer>

    <div id="notificationModal" class="modal"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', () => {
                    hamburger.classList.toggle('active');
                    navLinks.classList.toggle('active');
                });
            }

            const healthYes = document.getElementById('healthYes');
            const healthNo = document.getElementById('healthNo');
            const healthProblemField = document.getElementById('healthProblemField');
            healthYes.addEventListener('change', function() {
                if (this.checked) {
                    healthProblemField.style.display = 'block';
                    document.getElementById('healthProblemDetails').required = true;
                }
            });
            healthNo.addEventListener('change', function() {
                if (this.checked) {
                    healthProblemField.style.display = 'none';
                    document.getElementById('healthProblemDetails').required = false;
                }
            });
            
            const enrollmentForm = document.getElementById('enrollmentForm');
            const submitButton = document.getElementById('submitButton');
            const modal = document.getElementById('notificationModal');

            function showNotification(message, type) {
                modal.textContent = message;
                modal.className = 'modal ' + type;
                modal.classList.add('show');
                setTimeout(() => { modal.classList.remove('show'); }, 4000);
            }

            // Note: You still need to replace these with your actual EmailJS IDs
            emailjs.init("YOUR_EMAILJS_USER_ID"); 

            enrollmentForm.addEventListener('submit', function(e) {
                e.preventDefault();
                submitButton.disabled = true;
                submitButton.innerHTML = '<span>⏳</span> جاري الإرسال...';
                
                const serviceID = 'YOUR_SERVICE_ID';
                const confirmationTemplateID = 'YOUR_CONFIRMATION_TEMPLATE_ID';
                const notificationTemplateID = 'YOUR_NOTIFICATION_TEMPLATE_ID';

                const formData = {
                    fatherFirstName: this.fatherFirstName.value,
                    fatherLastName: this.fatherLastName.value,
                    motherFirstName: this.motherFirstName.value,
                    motherLastName: this.motherLastName.value,
                    childName: this.childName.value,
                    childBirthDate: this.childBirthDate.value,
                    parentPhone: this.parentPhone.value,
                    parentEmail: this.parentEmail.value,
                    healthProblem: document.querySelector('input[name="healthProblem"]:checked').value === "yes" ? "نعم" : "لا",
                    healthProblemDetails: this.healthProblemDetails?.value || "لا يوجد"
                };

                emailjs.send(serviceID, confirmationTemplateID, {
                    fatherFirstName: formData.fatherFirstName,
                    childName: formData.childName,
                    email: formData.parentEmail
                }).then(() => {
                    return emailjs.send(serviceID, notificationTemplateID, formData);
                }).then(() => {
                    showNotification("✅ تم إرسال طلبك بنجاح! سنتواصل معك قريباً.", 'success');
                    this.reset();
                    healthProblemField.style.display = 'none';
                }).catch(error => {
                    console.error("EmailJS Error:", error);
                    showNotification(`❌ حدث خطأ أثناء الإرسال. يرجى المحاولة مرة أخرى.`, 'error');
                }).finally(() => {
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<span>🚀</span> إرسال طلب التسجيل';
                });
            });
        });
    </script>
</body>
</html>
